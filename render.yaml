services:
  # Backend Web Service
  - type: web
    name: eventforge-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: HOLD_MINUTES
        value: "10"
      - key: AUTO_SEED
        value: "false"

  # Frontend Static Site
  - type: web
    name: eventforge-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
